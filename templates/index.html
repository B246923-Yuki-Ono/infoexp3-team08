<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>MiniBoard08</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main>
        <h1>MiniBoard08</h1>
        <p>チームで育てる小さなWebアプリケーション</p>

        <form id="form">
            <input id="name" maxlength="30" placeholder="Nickname" required>
            <p id="name-count" class="char-count">0 / 30文字</p>

            <textarea id="message" maxlength="300" placeholder="Message" required></textarea>
            <p id="message-count" class="char-count">0 / 300文字</p>

            <button>投稿</button>
        </form>

        <p id="status"></p>
        <section id="messages"></section>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
